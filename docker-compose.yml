name: ticket-booking

services:
  db:
    image: postgres:16-alpine
    container_name: ticket-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Пароль ролі реплікації (створюється db/primary/initdb при першій ініціалізації volume)
      REPLICATION_PASSWORD: replicator
    # Primary (ЛР6): WAL рівня replica для потокової реплікації, до 10 WAL sender-ів,
    # 256 МБ WAL зберігається для репліки, що відстала; власний pg_hba з правилом для replicator
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=256MB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      # Іменований volume: дані переживають restart / down (але не down -v)
      - pgdata:/var/lib/postgresql/data
      - ./db/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/primary/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - booking-net

  # Read Replica (ЛР6): асинхронна потокова реплікація з Primary (Hot Standby, лише читання).
  # При першому старті знімає копію Primary через pg_basebackup (db/replica/bootstrap.sh).
  db-replica:
    image: postgres:16-alpine
    container_name: ticket-booking-db-replica
    restart: unless-stopped
    user: postgres
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PRIMARY_HOST: db
      POSTGRES_PASSWORD: postgres
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
      REPLICA_NAME: db_replica
    ports:
      # 5433 на хості, щоб не конфліктувати з Primary (5432)
      - "5433:5432"
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./db/replica/bootstrap.sh:/bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - booking-net

  # Шарди замовлень (ЛР7): два незалежні вузли PostgreSQL, кожен зберігає свою частину таблиці Orders.
  # max_prepared_transactions > 0 — для двофазної фіксації (PREPARE TRANSACTION) при міжшардовій передачі замовлення.
  shard-a:
    image: postgres:16-alpine
    container_name: ticket-booking-shard-a
    restart: unless-stopped
    # Кожен шард — Primary зі своєю Read Replica (як основна БД у ЛР6): той самий pg_hba і роль replicator
    command: ["postgres", "-c", "max_prepared_transactions=20", "-c", "wal_level=replica", "-c", "max_wal_senders=10",
              "-c", "wal_keep_size=128MB", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REPLICATION_PASSWORD: replicator
    ports:
      - "5441:5432"
    volumes:
      - shard-a-data:/var/lib/postgresql/data
      - ./db/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/primary/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booking-net

  shard-b:
    image: postgres:16-alpine
    container_name: ticket-booking-shard-b
    restart: unless-stopped
    # Кожен шард — Primary зі своєю Read Replica (як основна БД у ЛР6): той самий pg_hba і роль replicator
    command: ["postgres", "-c", "max_prepared_transactions=20", "-c", "wal_level=replica", "-c", "max_wal_senders=10",
              "-c", "wal_keep_size=128MB", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REPLICATION_PASSWORD: replicator
    ports:
      - "5442:5432"
    volumes:
      - shard-b-data:/var/lib/postgresql/data
      - ./db/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/primary/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booking-net

  # Репліка шарду (ЛР7): Hot Standby, асинхронна потокова реплікація з shard-a. Читає аналітика (Scatter-Gather).
  shard-a-replica:
    image: postgres:16-alpine
    container_name: ticket-booking-shard-a-replica
    restart: unless-stopped
    user: postgres
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    command: ["-c", "max_prepared_transactions=20"]
    depends_on:
      shard-a:
        condition: service_healthy
    environment:
      PRIMARY_HOST: shard-a
      POSTGRES_PASSWORD: postgres
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
      REPLICA_NAME: shard_a_replica
    ports:
      - "5443:5432"
    volumes:
      - shard-a-replica-data:/var/lib/postgresql/data
      - ./db/replica/bootstrap.sh:/bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - booking-net

  # Репліка шарду (ЛР7): Hot Standby, асинхронна потокова реплікація з shard-b. Читає аналітика (Scatter-Gather).
  shard-b-replica:
    image: postgres:16-alpine
    container_name: ticket-booking-shard-b-replica
    restart: unless-stopped
    user: postgres
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    command: ["-c", "max_prepared_transactions=20"]
    depends_on:
      shard-b:
        condition: service_healthy
    environment:
      PRIMARY_HOST: shard-b
      POSTGRES_PASSWORD: postgres
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replicator
      REPLICA_NAME: shard_b_replica
    ports:
      - "5444:5432"
    volumes:
      - shard-b-replica-data:/var/lib/postgresql/data
      - ./db/replica/bootstrap.sh:/bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - booking-net

  redis:
    image: redis:7-alpine
    container_name: ticket-booking-redis
    restart: unless-stopped
    # Кеш ефемерний: без RDB/AOF (після рестарту Redis не повертає застарілі значення),
    # ліміт пам'яті 128 МБ і витіснення LRU серед усіх ключів при заповненні
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - booking-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-booking-api:latest
    # always (а не unless-stopped): після docker kill контейнер піднімається сам, без ручного --scale
    restart: always
    # Кілька реплік за Nginx. Без container_name (інакше --scale не працює) і без фіксованого host-порту.
    # Запуск: docker compose up -d --build --scale api=2 (те саме, що replicas: 2 нижче)
    deploy:
      replicas: 2
    depends_on:
      db:
        # API стартує лише після того, як pg_isready відповість успіхом
        condition: service_healthy
      # Репліка не обов'язкова: без неї читання йдуть на Primary (Primary Fallback)
      db-replica:
        condition: service_started
      shard-a:
        condition: service_healthy
      shard-b:
        condition: service_healthy
      # Репліки шардів не обов'язкові: без них аналітика читає з Primary шарду
      shard-a-replica:
        condition: service_started
      shard-b-replica:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Хост = ім'я сервісу бази у спільній мережі
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=ticket_booking_db;Username=postgres;Password=postgres;Maximum Pool Size=20"
      # Read Replica (ЛР6): eventual-читання. Timeout=2 — якщо репліка зависла, швидкий перехід на Primary
      ConnectionStrings__ReplicaConnection: "Host=db-replica;Port=5432;Database=ticket_booking_db;Username=postgres;Password=postgres;Maximum Pool Size=20;Timeout=2"
      Replication__Enabled: ${REPLICA_ENABLED:-true}
      ConnectionStrings__RedisConnection: "redis:6379"
      Jwt__SigningKey: "docker-compose-signing-key-for-lab-only-9f3c2a7e5b1d4c6f8a0e"
      # Шардинг замовлень (ЛР7): ключ — UserId, стратегія VirtualBuckets (64 бакети).
      # SHARD_STRATEGY=Modulo|Hash|VirtualBuckets, SHARD_COUNT=1 — топологія Single Node для порівняння
      Sharding__Strategy: ${SHARD_STRATEGY:-VirtualBuckets}
      Sharding__ActiveShards: ${SHARD_COUNT:-0}
      Sharding__Shards__0__Name: shard-a
      Sharding__Shards__0__ConnectionString: "Host=shard-a;Port=5432;Database=orders;Username=postgres;Password=postgres;Maximum Pool Size=20;Timeout=3"
      Sharding__Shards__1__Name: shard-b
      Sharding__Shards__1__ConnectionString: "Host=shard-b;Port=5432;Database=orders;Username=postgres;Password=postgres;Maximum Pool Size=20;Timeout=3"
      # Репліки шардів: аналітика (/orders/stats) читає з них. SHARD_ANALYTICS=Primary — аналітика на Primary шардів
      Sharding__AnalyticsReads: ${SHARD_ANALYTICS:-Replica}
      Sharding__Shards__0__ReplicaConnectionString: "Host=shard-a-replica;Port=5432;Database=orders;Username=postgres;Password=postgres;Maximum Pool Size=20;Timeout=2"
      Sharding__Shards__1__ReplicaConnectionString: "Host=shard-b-replica;Port=5432;Database=orders;Username=postgres;Password=postgres;Maximum Pool Size=20;Timeout=2"
    networks:
      - booking-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ticket-booking-nginx
    restart: unless-stopped
    depends_on:
      # Nginx резолвить api при старті. Якщо api ще не піднявся, upstream запам'ятає неповний список,
      # тому після `--scale` потрібен перезапуск: docker compose restart nginx
      - api
    ports:
      # Єдина точка входу для клієнтів: http://localhost/...
      - "80:80"
    volumes:
      - ./nginx/active/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - booking-net

  # Експеримент з асиметричним навантаженням (пункт 2.3): один "повільний" інстанс з затримкою 300 мс.
  #   docker compose --profile experiment up -d --build api-slow
  api-slow:
    profiles: ["experiment"]
    image: ticket-booking-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=ticket_booking_db;Username=postgres;Password=postgres;Maximum Pool Size=20"
      ConnectionStrings__RedisConnection: "redis:6379"
      Jwt__SigningKey: "docker-compose-signing-key-for-lab-only-9f3c2a7e5b1d4c6f8a0e"
      Lab__SimulatedLatencyMs: "300"
    networks:
      - booking-net

  # Інтеграційні тести (profile "tests", не стартує з `docker compose up`):
  #   docker compose --profile tests run --rm tests
  # Тести самі піднімають тимчасовий PostgreSQL через Testcontainers, тому потрібен доступ до docker.sock.
  tests:
    profiles: ["tests"]
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /src
    volumes:
      - .:/src
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Контейнер Postgres від Testcontainers публікується на хості Docker, а не на localhost тест-контейнера
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: dotnet test tests/TicketBooking.IntegrationTests --logger "console;verbosity=minimal"

volumes:
  pgdata:
  pgdata-replica:
  shard-a-data:
  shard-b-data:
  shard-a-replica-data:
  shard-b-replica-data:

networks:
  booking-net:
    driver: bridge
