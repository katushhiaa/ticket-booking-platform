# Балансувальник для кількох інстансів API (Round-Robin, без sticky sessions).
#
# Ім'я "api" резолвиться вбудованим DNS Docker (127.0.0.11) у IP усіх реплік сервісу api.
# Статичний upstream { server api:8080; } Nginx резолвить лише один раз при старті й бере
# першу адресу, тому всі запити йшли б в один контейнер. Змінна в proxy_pass змушує Nginx
# резолвити ім'я заново (valid=1s), а Docker віддає адреси по колу → запити чергуються.
server {
    listen 80;

    resolver 127.0.0.11 valid=1s ipv6=off;

    location / {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
