# КОНТРОЛЬ для пункту 2.4: proxy_next_upstream off — Nginx НЕ повторює запит на інший інстанс (клієнт бачить помилку).
# Passive Health Check: після 2 помилок сервер виключається з ротації на 10 с.
upstream api_servers {
    server api:8080 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Passive health checks: помилка на одному інстансі → повтор на наступному (клієнт не бачить 5xx)
        proxy_next_upstream off;
        proxy_next_upstream_tries 3;
    }
}
