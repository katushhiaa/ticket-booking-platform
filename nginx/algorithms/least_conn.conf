# Алгоритм 2: Least Connections. Новий запит іде на сервер з найменшою кількістю активних з'єднань.
# Вигідно при асиметричному навантаженні: повільний інстанс накопичує з'єднання і отримує менше запитів.
upstream api_servers {
    least_conn;
    server api:8080 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Passive health checks: помилка на одному інстансі → повтор на наступному (клієнт не бачить 5xx)
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 3;
    }
}
