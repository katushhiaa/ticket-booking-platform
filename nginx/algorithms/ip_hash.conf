# Алгоритм 3: IP Hash. Клієнт з одного IP завжди потрапляє на один і той самий сервер
# (псевдо-sticky). Вигідно для локальних кешів, але ламає рівномірність при малій кількості клієнтів (NAT).
upstream api_servers {
    ip_hash;
    server api:8080 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_servers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Passive health checks: помилка на одному інстансі → повтор на наступному (клієнт не бачить 5xx)
        # Без http_503 (ЛР6): 503 означає, що недоступна спільна залежність (Primary БД), а не сам інстанс.
        # Повтор на іншому інстансі не допоможе, а max_fails виключив би здорові інстанси з ротації —
        # і разом із записом перестали б працювати читання з репліки (no live upstreams → 502).
        proxy_next_upstream error timeout http_500 http_502;
        proxy_next_upstream_tries 3;
    }
}
