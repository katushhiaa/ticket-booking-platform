# pg_hba.conf Primary-вузла (ЛР6). Монтується в контейнер і підключається через -c hba_file=...,
# тому діє і для вже ініціалізованого volume (стандартний pg_hba всередині volume не змінюється).
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
# Потокова реплікація: лише окремий користувач replicator, лише з паролем (SCRAM)
host    replication     replicator      all                     scram-sha-256
host    all             all             all                     scram-sha-256
